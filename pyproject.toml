[project]
name = "voicebridge"
version = "0.1.0"
description = "Real-time voice translation PoC orchestrator (Phase 1)."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "sounddevice",
    "websockets>=12",
]

[project.scripts]
voicebridge = "voicebridge.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicebridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

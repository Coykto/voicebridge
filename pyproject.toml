[project]
name = "voicebridge"
version = "0.0.0"
description = "Real-time voice translation PoC: local playback orchestrator."
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voicebridge"]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
